[opener]
edit = [
    { run = 'code --wait "$@"', block = true }
]

[open]
rules = [
    # Match specific names
    { name = "Dockerfile", use = "edit" },
    { name = "docker-compose.yml", use = "edit" },

    # Match common code files individually (safer than a big list)
    { name = "*.sh", use = "edit" },
    { name = "*.py", use = "edit" },
    { name = "*.json", use = "edit" },
    { name = "*.toml", use = "edit" },
    { name = "*.conf", use = "edit" },
    { name = "*.txt", use = "edit" },
    { name = "*.md", use = "edit" },

    # Catch any file the system identifies as "text"
    { mime = "text/*", use = "edit" }
]